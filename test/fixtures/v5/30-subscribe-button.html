<!-- Subscribe button: 5 states. The <span>s are siblings that follow the button. -->

<!-- idle -->
<button type="button" data-mesub-subscribe="" data-mesub-state="idle">Subscribe</button
<span data-mesub-hint="">Your wallet confirms 2 USDC now. Next charges run every 3 days, no signature needed.</span>

<!-- signing -->
<button type="button" data-mesub-subscribe="" data-mesub-state="signing" aria-busy="true" aria-disabled="true">Approve in your wallet</button>

<!-- confirming -->
<button type="button" data-mesub-subscribe="" data-mesub-state="confirming" aria-busy="true" aria-disabled="true">Confirming</button>

<!-- subscribed -->
<button type="button" data-mesub-subscribe="" data-mesub-state="subscribed" disabled="disabled">Subscribed</button
<span data-mesub-receipt="">Next charge Oct 4, 2026 · <a href="https://explorer.solana.com/tx/[SIGNATURE]" target="_blank" rel="noopener">Receipt</a></span>

<!-- error -->
<button type="button" data-mesub-subscribe="" data-mesub-state="error">Try again</button
<span role="alert" data-mesub-error="">You closed Phantom before approving. Nothing was charged.</span>
